<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쭈계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ff;--card:#fff;--ink:#3a2f57;--sub:#8f84a8;--line:#e4d9fb;--in:#4f8cff;--out:#f2683c;--acc:#8b6cf0;--accfg:#fff;--btn:#ffd43b;--btnfg:#3a2f57;--btnsh:#e0b020;--h1:#e9e0ff;--h2:#fff2b8;--sh:#cbbcf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1833;--card:#2d2444;--ink:#f3eeff;--sub:#a99fc4;--line:#43375f;--in:#7fb0ff;--out:#ff9a6e;--acc:#a78bfa;--accfg:#1f1833;--btn:#ffd43b;--btnfg:#2b2140;--btnsh:#b8921a;--h1:#3d2d70;--h2:#4f4420;--sh:#150f26}}
:root[data-theme="dark"]{--bg:#1f1833;--card:#2d2444;--ink:#f3eeff;--sub:#a99fc4;--line:#43375f;--in:#7fb0ff;--out:#ff9a6e;--acc:#a78bfa;--accfg:#1f1833;--btn:#ffd43b;--btnfg:#2b2140;--btnsh:#b8921a;--h1:#3d2d70;--h2:#4f4420;--sh:#150f26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
.row>*,form>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input[type=number],input[type=text]{-webkit-appearance:none;appearance:none;min-height:46px}
select{min-height:46px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.num{font-variant-numeric:tabular-nums}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month b{font-size:18px}
.month button{background:none;border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.hero small{color:var(--sub)}
.bal{font-size:clamp(28px,9vw,40px);word-break:keep-all;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.split i{display:block;transition:width .3s}
.split .a{background:var(--in)}.split .b{background:var(--out)}
.io{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.io .a{color:var(--in)}.io .b{color:var(--out)}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);font-size:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{text-align:center;padding:9px 2px;cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{display:block;margin:-9px -2px;padding:9px 2px;background:var(--acc);color:var(--accfg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.seg input:focus-visible+span,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.add{padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:inherit;font-weight:700;cursor:pointer}
h2{font-size:15px;margin:22px 0 8px}
.cat{display:grid;grid-template-columns:112px 1fr auto;gap:10px;align-items:center;font-size:14px;margin-bottom:6px}
.cat div{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cat div i{display:block;height:100%;background:var(--out)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.gh{display:flex;justify-content:space-between;margin-bottom:8px}.sub{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:0 0 4px 12px}.item .p.sav{color:#2dcdb2}[hidden]{display:none!important}
.pane{display:none}.pane.on{display:block}.tabs button{touch-action:manipulation}
#err{background:#e0394a;color:#fff;padding:10px 14px;font-size:13px;word-break:break-all}
.ttl{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--line);padding:4px;border-radius:12px}.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:9px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer}.tabs button.on{background:var(--card);color:var(--ink)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}thead th{background:var(--bg);font-weight:500;color:var(--sub)}.r{text-align:right;white-space:nowrap}.sm{font-size:12px;font-weight:400;color:var(--sub)}.gs td,.gs th{border-top:2px solid var(--ink)}tfoot th{text-align:right;font-weight:500}tfoot td{font-weight:700}
.tbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tbar b{font-size:15px}
#tgl{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.sc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.sc .sl{color:var(--sub);font-size:13px}.sc .sbig{font-size:clamp(26px,8vw,32px);font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}.stack i{display:block;min-width:0}
.lg{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--sub);gap:6px}.lg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.lg em{font-style:normal;color:var(--ink);font-weight:700}
.gc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 18px 4px;margin-bottom:12px}
.gsec{padding:14px 0;border-bottom:1px solid var(--line)}.gsec:last-child{border-bottom:0}
.gh2{display:flex;align-items:center;gap:8px;margin-bottom:10px}.gh2 .dot{width:10px;height:10px;border-radius:50%}.gh2 b{font-size:15px}.gh2 .gp{color:var(--sub);font-size:12px;background:var(--bg);padding:1px 8px;border-radius:999px}.gh2 .ga{margin-left:auto;font-weight:700}
.rw{display:grid;grid-template-columns:minmax(80px,132px) minmax(24px,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.rw .rb{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.rw .rb i{display:block;height:100%;border-radius:3px}.rw .ra{text-align:right}.rw.z{color:var(--sub)}
.rs{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);padding:1px 0 3px 12px}
.none{color:var(--sub);font-size:13px;padding:2px 0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.fg small{display:block;color:var(--sub);font-size:12px}.fg b{font-size:17px}
.day{color:var(--sub);font-size:13px;margin:16px 0 4px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px}
.item .t{flex:1;min-width:0}
.item .t span{display:block;font-size:12px;color:var(--sub)}
.item .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .p{font-weight:700}.item .p.in{color:var(--in)}.item .p.out{color:var(--out)}
.item button{background:none;border:0;color:var(--sub);font-size:18px;cursor:pointer;padding:4px 8px}
.empty{text-align:center;color:var(--sub);padding:28px 0}

/* cute theme */
.ttl{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:32px;color:var(--acc);margin:6px 0 14px}
.month b,.bal,.sbig,.tbar b,h2,.gh2 b,.fg b,.add{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}
.hero,form,.sc,.gc,.fg div,.item{border:2px solid var(--line);box-shadow:0 4px 0 var(--sh)}
.item{box-shadow:0 3px 0 var(--sh);border-radius:18px}
.hero{border-radius:26px;background:linear-gradient(135deg,var(--h1),var(--h2))}
.sc,.gc{border-radius:26px}form{border-radius:24px}.fg div{border-radius:20px}
.bal{font-size:clamp(30px,10vw,44px);color:var(--ink)}
.split,.stack{height:14px;border-radius:7px;background:rgba(255,255,255,.55)}
.stack{background:var(--line)}
.month button{border:2px solid var(--line);background:var(--card);box-shadow:0 2px 0 var(--sh)}
.tabs{border-radius:999px;background:var(--line)}.tabs button{border-radius:999px;font-family:"Jua","Gowun Dodum",sans-serif;font-size:16px;font-weight:400}
.tabs button.on{background:var(--acc);color:var(--accfg);box-shadow:0 2px 0 var(--sh)}
input[type=text],input[type=number],input[type=date],select{border:2px solid var(--line);border-radius:14px;background:var(--card)}
.add{border-radius:999px;font-size:18px;padding:13px;background:var(--btn);color:var(--btnfg);box-shadow:0 4px 0 var(--btnsh);transition:transform .08s,box-shadow .08s}
.add:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnsh)}
.ic{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.item .p{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:16px}
#tgl{border:2px solid var(--line)}
.gh2 .gp{background:var(--line);color:var(--ink)}
.day{font-weight:400}
.io{flex-wrap:wrap;gap:2px 12px;font-size:13.5px}.io span{white-space:nowrap}
</style>
</head>
<body>
<div id="err" style="display:none"></div>
<main>
  <h1 class="ttl">쭈계부 <span aria-hidden="true">🧮</span></h1>
  <div class="month">
    <button id="prev" aria-label="이전 달">‹</button>
    <b id="mlabel"></b>
    <button id="next" aria-label="다음 달">›</button>
  </div>

  <nav class="tabs"><button id="t1" class="on">📝 내역</button><button id="t2">📊 통계</button></nav>

  <div id="p1" class="pane on">
  <section class="hero">
    <small>💰 이번 달 남은 돈 (수입 − 지출 − 저축)</small>
    <div class="bal num" id="bal">0원</div>
    <div class="split"><i id="sf" style="background:#a78bfa"></i><i id="sv" style="background:#ffc21f"></i><i id="ss" style="background:#2dcdb2"></i></div>
    <div class="io num"><span class="a" id="inc">수입 0원</span><span class="b" id="exp">지출 0원</span><span id="svt" style="color:#2dcdb2">저축 0원</span></div>
  </section>

  <form id="f">
        <div class="row">
      <input type="number" id="amt" inputmode="numeric" min="1" placeholder="금액(원)" required aria-label="금액">
      <input type="date" id="date" required aria-label="날짜">
    </div>
    <div class="row">
      <select id="cat" aria-label="항목"></select>
      <select id="sub" aria-label="소분류"></select>
    </div>
    <input type="text" id="memo" placeholder="메모 (선택)" maxlength="40" aria-label="메모">
    <button class="add" type="submit">✨ 내역 추가</button>
  </form>

  <h2>내역</h2>
  <div id="list"></div>
  </div>

  <div id="p2" class="pane">
    <div class="tbar"><b id="stitle">이번 달 통계</b><button id="tgl" type="button">빈 항목도 보기</button></div>
    <div id="stat"></div>
  </div>
</main>

<script>
window.addEventListener("error",function(e){var d=document.getElementById("err");d.style.display="block";d.textContent="오류: "+e.message+" (줄 "+e.lineno+")"});
</script>
<script>
const TREE={
  in:{label:'수입',cats:{'월급':[],'용돈':[],'부수입':[],'기타수입':[]}},
  fix:{label:'고정지출',cats:{'주거 (월세·관리비)':[],'통신':[],'보험':[],'대출 이자':[],'구독·멤버십':[],'모임 회비':[]}},
  var:{label:'변동지출',cats:{'식비':['식대','간식','음료'],'교통':['대중교통','유류,주차'],'생활용품':[],'의료·건강':[],'문화·여가':[],'경조사·선물':[],'쇼핑':[],'기타':[]}},
  sav:{label:'저축',cats:{'적금':[]}}
};
const CE={'주거 (월세·관리비)':'🏠','통신':'📱','보험':'🛡️','대출 이자':'🏦','구독·멤버십':'📺','모임 회비':'🍻','식비':'🍚','교통':'🚌','생활용품':'🧴','의료·건강':'💊','문화·여가':'🎬','경조사·선물':'🎁','쇼핑':'🛍️','기타':'✨','적금':'🐷','월급':'💵','용돈':'🧧','부수입':'💸','기타수입':'🍀'};
const COL={fix:'#a78bfa',var:'#ffc21f',sav:'#2dcdb2'};
const KEY='gagyebu-v1';
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
// 예전 버전 데이터(지출) → 고정/변동으로 이전
items=items.map(i=>{
  if(i.type==='in')return i.cat==='기타'?Object.assign({},i,{cat:'기타수입'}):i;
  if(i.type!=='out')return i;
  const m={'주거':'주거 (월세·관리비)','의료':'의료·건강','문화':'문화·여가'};
  const cat=m[i.cat]||i.cat;
  const g=['주거 (월세·관리비)','통신'].includes(cat)?'fix':'var';
  return Object.assign({},i,{type:g,cat:TREE[g].cats[cat]?cat:'기타'});
});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const $=id=>document.getElementById(id);
const won=n=>n.toLocaleString('ko-KR')+'원';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((s,i)=>s+i.amount,0);
const CAT2={};
for(const t in TREE)for(const c in TREE[t].cats)CAT2[c]=t;
let ym=today().slice(0,7),showAll=false;

function fillCats(){
  $('cat').innerHTML=['fix','var','sav','in'].map(t=>`<optgroup label="${TREE[t].label}">`+Object.keys(TREE[t].cats).map(c=>`<option value="${esc(c)}">${CE[c]||''} ${esc(c)}</option>`).join('')+'</optgroup>').join('');
  $('cat').value='식비';
  fillSub();
}
function fillSub(){
  const subs=TREE[CAT2[$('cat').value]].cats[$('cat').value]||[];
  $('sub').style.display=subs.length?'':'none';
  $('cat').style.gridColumn=subs.length?'':'1 / -1';
  $('sub').innerHTML=subs.map(s=>`<option>${esc(s)}</option>`).join('');
}
$('cat').onchange=fillSub;

function shift(n){
  let [y,m]=ym.split('-').map(Number);m+=n;
  if(m<1){m=12;y--}if(m>12){m=1;y++}
  ym=y+'-'+String(m).padStart(2,'0');render();
}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);

$('f').onsubmit=e=>{
  e.preventDefault();
  const amount=parseInt($('amt').value,10);
  if(!amount||amount<1)return;
  const subs=TREE[CAT2[$('cat').value]].cats[$('cat').value]||[];
  items.push({id:Date.now(),type:CAT2[$('cat').value],amount,date:$('date').value,cat:$('cat').value,sub:subs.length?$('sub').value:'',memo:$('memo').value.trim()});
  save();
  $('amt').value='';$('memo').value='';
  ym=$('date').value.slice(0,7);
  render();
};
function tab(n){$('p1').className='pane'+(n===1?' on':'');$('p2').className='pane'+(n===2?' on':'');$('t1').className=n===1?'on':'';$('t2').className=n===2?'on':''}
$('t1').addEventListener('click',function(){tab(1)});$('t2').addEventListener('click',function(){tab(2)});
$('tgl').addEventListener('click',function(){showAll=!showAll;render()});
function del(id){items=items.filter(i=>i.id!==id);save();render()}

function render(){
  const [y,m]=ym.split('-');
  $('mlabel').textContent=y+'년 '+Number(m)+'월';
  const cur=items.filter(i=>i.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const by=t=>sum(cur.filter(i=>i.type===t));
  const inc=by('in'),fix=by('fix'),vr=by('var'),sav=by('sav');
  const left=inc-fix-vr-sav;
  $('bal').textContent=(left<0?'-':'')+won(Math.abs(left));
  $('inc').textContent='수입 '+won(inc);
  $('exp').textContent='지출 '+won(fix+vr);
  $('svt').textContent='저축 '+won(sav);
  const den=Math.max(inc,fix+vr+sav)||1;
  $('sf').style.width=fix/den*100+'%';
  $('sv').style.width=vr/den*100+'%';
  $('ss').style.width=sav/den*100+'%';

  const tot=fix+vr+sav,val={fix:fix,var:vr,sav:sav};
  const pct=v=>tot?Math.round(v/tot*100):0;
  let h=`<div class="sc"><div class="sl">이번 달 지출·저축</div><div class="sbig num">${won(tot)}</div><div class="stack">${['fix','var','sav'].map(g=>`<i style="width:${tot?val[g]/tot*100:0}%;background:${COL[g]}"></i>`).join('')}</div><div class="lg">${['fix','var','sav'].map(g=>`<span><b style="background:${COL[g]}"></b>${TREE[g].label} <em class="num">${pct(val[g])}%</em></span>`).join('')}</div></div><div class="gc">`;
  ['fix','var','sav'].forEach(g=>{
    const gi=cur.filter(i=>i.type===g),gs=sum(gi);
    let rows='';
    Object.entries(TREE[g].cats).forEach(([c,subs])=>{
      const ci=gi.filter(i=>i.cat===c),ct=sum(ci);
      if(!ct&&!showAll)return;
      rows+=`<div class="rw${ct?'':' z'}"><span>${CE[c]||''} ${esc(c)}</span><span class="rb"><i style="width:${gs?ct/gs*100:0}%;background:${COL[g]}"></i></span><span class="num ra">${ct?won(ct):'-'}</span></div>`;
      if(subs.length){
        const ls=subs.map(x=>[x,sum(ci.filter(i=>i.sub===x))]);
        const u=sum(ci.filter(i=>!i.sub));if(u)ls.push(['미분류',u]);
        ls.forEach(l=>{if(l[1]||showAll)rows+=`<div class="rs"><span>${esc(l[0])}</span><span class="num">${l[1]?won(l[1]):'-'}</span></div>`});
      }
    });
    if(!rows)rows='<div class="none">🫧 내역이 없어요</div>';
    h+=`<div class="gsec"><div class="gh2"><span class="dot" style="background:${COL[g]}"></span><b>${TREE[g].label}</b><span class="gp num">${pct(gs)}%</span><span class="num ga">${won(gs)}</span></div>${rows}</div>`;
  });
  h+=`</div><div class="fg"><div><small>수입</small><b class="num" style="color:var(--in)">${won(inc)}</b></div><div><small>지출 (고정+변동)</small><b class="num">${won(fix+vr)}</b></div><div><small>저축</small><b class="num" style="color:${COL.sav}">${won(sav)}</b></div><div><small>남은 돈</small><b class="num">${left<0?'-':''}${won(Math.abs(left))}</b></div></div>`;
  $('stat').innerHTML=h;
  $('tgl').textContent=showAll?'사용한 항목만':'빈 항목도 보기';

  if(!cur.length){$('list').innerHTML='<div class="empty">🌱 이번 달 내역이 없어요.<br>위에서 첫 내역을 추가해 보세요.</div>';return}
  const days={};cur.forEach(i=>(days[i.date]=days[i.date]||[]).push(i));
  const wd=['일','월','화','수','목','금','토'];
  $('list').innerHTML=Object.keys(days).sort().reverse().map(d=>{
    const dt=new Date(d+'T00:00:00');
    const s=days[d].reduce((a,i)=>a+(i.type==='in'?i.amount:-i.amount),0);
    return `<div class="day"><span>${Number(d.slice(8))}일 (${wd[dt.getDay()]})</span><span class="num">${s<0?'-':'+'}${won(Math.abs(s))}</span></div>`+
    days[d].map(i=>`<div class="item"><span class="ic">${CE[i.cat]||'✨'}</span><div class="t"><b>${esc(i.memo||i.sub||i.cat)}</b><span>${TREE[i.type].label} › ${esc(i.cat)}${i.sub?' › '+esc(i.sub):''}</span></div><div class="p num ${i.type==='in'?'in':i.type==='sav'?'sav':'out'}">${i.type==='in'?'+':'-'}${won(i.amount)}</div><button data-id="${i.id}" aria-label="삭제">×</button></div>`).join('');
  }).join('');
  $('list').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>del(Number(b.dataset.id)));
}

$('date').value=today();
fillCats();render();
</script>
</body>
</html>
